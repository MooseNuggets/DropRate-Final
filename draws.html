<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draws — DROPRATE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Poppins:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1020;--navy2:#161b31;--line:#262d52;--gold:#ffc24b;--gold-deep:#e8941b;
--purple:#8b7bff;--white:#eef1fc;--dim:#97a0c8;--green:#4ade80;--red:#f87171}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--navy);color:var(--white);font-family:'Poppins',sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.06em;text-decoration:none;color:var(--white)}
.nav .links{display:flex;gap:18px}
.nav .links a{color:var(--dim);font-size:.85rem;text-decoration:none}
.nav .links a:hover{color:var(--gold)}
main{padding:56px 0 80px}
h1{font-size:1.9rem;margin-bottom:8px}
.sub{color:var(--dim);font-size:.92rem;line-height:1.7;margin-bottom:34px;max-width:600px}
h2{font-size:1.15rem;margin:38px 0 16px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-size:.85rem}
.card{background:var(--navy2);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:14px}
.row1{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.prize{font-weight:600;font-size:1.02rem}
.when{color:var(--dim);font-size:.8rem}
.meta{color:var(--dim);font-size:.78rem;margin-top:10px;line-height:1.7;word-break:break-all}
.meta b{color:var(--white);font-weight:500}
.win{font-family:ui-monospace,Menlo,monospace;font-size:.78rem;color:var(--green)}
.win.expired{color:var(--dim);text-decoration:line-through}
.freeform{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.freeform input{flex:1;min-width:200px;background:var(--navy);border:1px solid var(--line);border-radius:10px;
padding:11px 14px;color:var(--white);font-family:ui-monospace,Menlo,monospace;font-size:.8rem;outline:none}
.freeform input:focus{border-color:var(--gold)}
.freeform button{background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#231a05;border:none;
border-radius:10px;padding:11px 20px;font-family:'Poppins';font-weight:600;font-size:.82rem;cursor:pointer}
.hp{position:absolute;left:-9999px;opacity:0}
.note{font-size:.75rem;color:var(--dim);margin-top:8px}
.ok{color:var(--green);font-size:.8rem;margin-top:8px}
.err{color:var(--red);font-size:.8rem;margin-top:8px}
.empty{color:var(--dim);font-size:.88rem}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.pills span{display:inline-flex;align-items:center;gap:5px;background:rgba(13,16,32,.6);
border:1px solid var(--line);padding:5px 12px;border-radius:8px;font-size:.76rem;
color:var(--dim);white-space:nowrap}
.pills b{color:var(--ice);font-weight:600}
.pills .p-gold{border-color:rgba(255,194,75,.4)} .pills .p-gold b{color:var(--gold)}
details.fold{margin-bottom:14px}
details.fold>summary{cursor:pointer;list-style:none;background:var(--navy2);border:1px solid var(--line);
border-radius:14px;padding:16px 22px;font-size:.88rem;font-weight:600;color:var(--gold);
display:flex;justify-content:space-between;align-items:center;transition:border-color .2s}
details.fold>summary:hover{border-color:var(--gold)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"▾";transition:transform .2s}
details.fold[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
details.fold[open]>summary::after{transform:rotate(180deg)}
details.fold>.fold-body{border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px;padding:14px 14px 0}

h1,h2,.brand{font-family:'Chakra Petch',sans-serif;text-transform:uppercase;letter-spacing:.04em}
code,.mono,input,textarea{font-family:'JetBrains Mono',ui-monospace,monospace!important}
</style>
</head>
<body>
<header><div class="wrap nav">
  <a class="brand" href="/"><svg width="22" height="26" viewBox="0 0 100 116"><path id="bd" fill="#ffc24b"></path></svg>DROPRATE</a>
<div class="links"><a href="/check.html">Eligibility</a><a href="/claim.html">Claim</a><a href="/verify.html">Verify</a></div>
</div></header>

<main class="wrap">
  <h1>Draws</h1>
  <p class="sub">Every draw is locked in before it runs — the winner is picked by
     <a href="https://drand.love" target="_blank" rel="noopener" style="color:var(--gold)">public randomness</a>
     that nobody controls, not even us. When a draw completes, the result and its proof are published right here for anyone to check.</p>

  <h2>Upcoming</h2>
  <div id="upcoming"><p class="empty">Loading…</p></div>

  <h2>Completed</h2>
  <div id="done"><p class="empty">Loading…</p></div>
</main>

<script>
(function(){let d="";for(let i=0;i<=96;i++){const t=2*Math.PI*i/96;
const x=50+(Math.sin(t)*Math.sin(t/2)**2)/0.77*38,y=58-Math.cos(t)*48;
d+=(i?"L":"M")+x.toFixed(2)+" "+y.toFixed(2);}document.getElementById("bd").setAttribute("d",d+"Z");})();

const esc=(s)=>{const d=document.createElement("div");d.textContent=String(s);return d.innerHTML;};
const short=(w)=>w.length>12?w.slice(0,4)+"…"+w.slice(-4):w;
const fmtT=(t)=>new Date(t).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});

async function load(){
  try{
    const {draws,live_holders,live_tickets}=await fetch("/api/draws").then(r=>r.json());
    const liveHolders=live_holders||0,liveTickets=live_tickets||0;
    const up=draws.filter(d=>d.status!=="drawn").sort((a,b)=>new Date(a.scheduled_at)-new Date(b.scheduled_at));
    const done=draws.filter(d=>d.status==="drawn");

    const upCard = (d)=>`
      <div class="card">
        <div class="row1"><span class="prize">${esc(d.prize_title)}</span>
          <span class="when">Draw #${d.id} · ${fmtT(d.scheduled_at)}</span></div>
        <div class="meta">${d.drand_round?`🔒 <b>Draw locked</b> — winner picked by public randomness, tamper-proof.`:"🔒 Locking in…"}</div>
        <div class="pills">
          <span>🏆 <b>${d.n_winners}</b> winner${d.n_winners===1?"":"s"}</span>
          <span>🎟 <b>${d.live_free||0}</b> free ${(d.live_free||0)===1?"entry":"entries"}</span>
          <span class="p-gold">💎 <b>${liveHolders}</b> holders · <b>${liveTickets.toLocaleString()}</b> tickets</span>
        </div>
        <div class="freeform">
          <input placeholder="Wallet address (free entry — no purchase necessary)" data-w="${d.id}">
          <input class="hp" name="website" tabindex="-1" autocomplete="off" data-hp="${d.id}">
          <button data-enter="${d.id}">Free entry</button>
        </div>
        <div class="note">One free entry per wallet per draw — worth 1 ticket, same odds per ticket as holders.</div>
        <div data-msg="${d.id}"></div>
      </div>`;
    document.getElementById("upcoming").innerHTML = up.length
      ? upCard(up[0]) + (up.length > 1
          ? `<details class="fold"><summary>${up.length-1} more upcoming draw${up.length-1===1?"":"s"}</summary><div class="fold-body">${up.slice(1).map(upCard).join("")}</div></details>`
          : "")
      : '<p class="empty">No draws scheduled yet — first draws go up at launch.</p>';

    const doneCard = (d)=>`
      <div class="card">
        <div class="row1"><span class="prize">${esc(d.prize_title)}</span>
          <span class="when">Draw #${d.id} · ${fmtT(d.scheduled_at)}</span></div>
        <div class="meta">
          Winners: ${d.winners.map(w=>`<span class="win ${w.status==="expired"?"expired":""}">${short(w.wallet)}</span>`).join(" · ")||"—"}<br>
          ${d.pool_tickets!=null?`Pool: <b>${d.pool_holders||0}</b> holders · <b>${d.pool_tickets.toLocaleString()}</b> tickets · <b>${d.pool_free||0}</b> free entries<br>`:""}
          Proof: round <b>${d.drand_round}</b> · seed <b>${(d.seed||"").slice(0,16)}…</b> · snapshot root <b>${(d.merkle_root||"").slice(0,16)}…</b><br>
         Verify: <a href="/verify.html?draw=${d.id}" style="color:var(--gold);font-weight:600">re-run this draw in your browser →</a>
        </div>
      </div>`;
    document.getElementById("done").innerHTML = done.length
      ? `<details class="fold"><summary>${done.length} completed draw${done.length===1?"":"s"} — results &amp; proofs</summary><div class="fold-body">${done.map(doneCard).join("")}</div></details>`
      : '<p class="empty">No completed draws yet.</p>';

    document.querySelectorAll("[data-enter]").forEach(btn=>btn.addEventListener("click",()=>enter(btn.dataset.enter)));
  }catch(e){
    document.getElementById("upcoming").innerHTML='<p class="empty">Could not load draws.</p>';
    document.getElementById("done").innerHTML="";
  }
}

async function enter(id){
  const w=document.querySelector(`[data-w="${id}"]`).value.trim();
  const hp=document.querySelector(`[data-hp="${id}"]`).value;
  const msg=document.querySelector(`[data-msg="${id}"]`);
  msg.innerHTML="";
  try{
    const res=await fetch("/api/free-entry",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({wallet:w,draw_id:Number(id),website:hp})});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||"entry failed");
    msg.innerHTML='<div class="ok">You\'re entered. Good luck!</div>';
  }catch(e){
    msg.innerHTML=`<div class="err">${esc(e.message)}</div>`;
  }
}
load();
</script>
</body>
</html>
