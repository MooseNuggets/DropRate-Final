<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Developer Portal — DROPRATE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Poppins:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1020;--navy2:#161b31;--navy3:#1b2140;--line:#262d52;--line2:rgba(255,255,255,.15);
--gold:#ffc24b;--gold-deep:#e8941b;--gold-2:#FCD05B;--spark:#8b7bff;--cyan:#4ec9ff;
--ink:#eef1fc;--muted:#97a0c8;--green:#4ade80;--red:#f87171}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--navy);color:var(--ink);font-family:'Poppins',sans-serif;min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:0 24px}
.disp{font-family:'Chakra Petch',sans-serif;text-transform:uppercase;letter-spacing:.04em}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
a{color:inherit;text-decoration:none}
/* header — copied from the homepage so fonts/sizes/logo match exactly */
header{position:sticky;top:0;z-index:40;background:rgba(13,16,32,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;max-width:1080px;margin:0 auto;padding:0 24px}
.brand{display:flex;align-items:center;gap:11px;font-family:'Chakra Petch',sans-serif;text-transform:uppercase;font-weight:700;letter-spacing:.1em;font-size:1.02rem;text-decoration:none;color:var(--ink)}
.brand .rate{color:var(--gold)}
.nav-links{display:flex;align-items:center;gap:26px;font-size:.8rem;color:var(--muted);letter-spacing:.08em}
.nav-links a{text-decoration:none;color:var(--muted);transition:color .2s}
.nav-links a:hover{color:var(--gold)}
.nav-links .linkbtn{background:none;border:0;cursor:pointer;font-family:'Poppins',sans-serif;font-size:.8rem;letter-spacing:.08em;color:var(--muted);padding:0;transition:color .2s}
.nav-links .linkbtn:hover{color:var(--gold)}
.nav-links .linkbtn.gold{color:var(--gold)}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:8px;color:var(--gold);font-size:1.3rem;padding:4px 12px;cursor:pointer;line-height:1.4}
@media(max-width:760px){
  .nav-links{display:none;position:absolute;top:64px;left:0;right:0;background:var(--navy2);border-bottom:1px solid var(--line);flex-direction:column;align-items:flex-start;gap:0;padding:8px 0;z-index:30}
  .nav-links.open{display:flex}
  .nav-links a,.nav-links .linkbtn{padding:14px 24px;border-top:1px solid var(--line);font-size:.95rem;width:100%;text-align:left}
  .menu-btn{display:block}
}
h1{font-family:'Chakra Petch',sans-serif;text-transform:uppercase;font-size:1.8rem;margin:30px 0 4px}
.sub{color:var(--muted);font-size:.92rem;margin-bottom:22px;max-width:640px;line-height:1.6}
.panel{background:var(--navy2);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
.panel h3{font-family:'Chakra Petch',sans-serif;text-transform:uppercase;font-size:1rem;margin-bottom:4px}
.panel p.hint{color:var(--muted);font-size:.82rem;line-height:1.55;margin-bottom:16px}
label.f{display:block;font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
input,textarea,select{width:100%;background:var(--navy);border:1px solid var(--line2);border-radius:10px;color:var(--ink);
padding:11px 13px;font-family:'JetBrains Mono',monospace;font-size:.84rem;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
textarea{min-height:120px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:150px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-size:.85rem;cursor:pointer;
background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#12152b;transition:.15s}
.btn:hover{filter:brightness(1.05)} .btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--ink)}
.pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:7px}
.pill.ok{color:var(--green);border:1px solid color-mix(in srgb,var(--green) 45%,transparent)}
.pill.warn{color:var(--gold-2);border:1px solid color-mix(in srgb,var(--gold-2) 45%,transparent)}
.pill.muted{color:var(--muted);border:1px solid var(--line2)}
.prodrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.prodrow:first-child{border-top:0}
.mini{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:50px 0;font-family:'JetBrains Mono',monospace;font-size:.88rem}
.res{font-family:'JetBrains Mono',monospace;font-size:.78rem;margin-top:10px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#0c1024;border:1px solid var(--line2);
color:var(--ink);padding:12px 18px;border-radius:12px;font-size:.86rem;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ov{position:fixed;inset:0;background:rgba(2,4,12,.8);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px}
.ovcard{background:#0c1024;border:1px solid var(--line2);border-radius:18px;padding:24px;max-width:480px;width:100%}
</style>
</head>
<body>
<header>
  <div class="nav">
    <a class="brand" href="/">
      <svg width="22" height="26" viewBox="0 0 100 116" aria-hidden="true">
        <defs><linearGradient id="gh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc24b"/><stop offset="1" stop-color="#e8941b"/></linearGradient></defs>
        <path d="M50.0 10.0L50.0 10.2L50.1 10.7L50.2 11.6L50.5 12.9L51.0 14.5L51.7 16.4L52.6 18.7L53.7 21.2L55.1 24.1L56.8 27.1L58.6 30.5L60.7 34.0L62.9 37.7L65.3 41.6L67.7 45.6L70.1 49.7L72.4 53.8L74.7 58.0L76.7 62.2L78.5 66.3L80.0 70.4L81.1 74.4L81.8 78.3L82.1 82.0L81.8 85.5L81.1 88.9L79.8 91.9L78.0 94.8L75.7 97.3L73.0 99.6L69.9 101.5L66.4 103.1L62.6 104.4L58.5 105.3L54.3 105.8L50.0 106.0L45.7 105.8L41.5 105.3L37.4 104.4L33.6 103.1L30.1 101.5L27.0 99.6L24.3 97.3L22.0 94.8L20.2 91.9L18.9 88.9L18.2 85.5L17.9 82.0L18.2 78.3L18.9 74.4L20.0 70.4L21.5 66.3L23.3 62.2L25.3 58.0L27.6 53.8L29.9 49.7L32.3 45.6L34.7 41.6L37.1 37.7L39.3 34.0L41.4 30.5L43.2 27.1L44.9 24.1L46.3 21.2L47.4 18.7L48.3 16.4L49.0 14.5L49.5 12.9L49.8 11.6L49.9 10.7L50.0 10.2L50.0 10.0Z" fill="url(#gh)"/>
      </svg>
      <span>DROP<span class="rate">RATE</span></span>
    </a>
    <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
    <nav class="nav-links" id="nav">
      <a href="/draws.html">Draws</a>
      <a href="/crates.html">Crates</a>
      <a href="/marketplace.html">Marketplace</a>
      <a href="/docs.html">Docs</a>
      <a href="/verify.html">Verify</a>
      <a href="/check.html" style="color:var(--gold)">Check eligibility</a>
      <button class="linkbtn gold" id="connectBtn">Connect Wallet</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1>Developer Portal</h1>
  <p class="sub">List your Steam keys and keep up to 98.5% — vs Steam's 70%. Keys are encrypted the moment you upload them, escrowed until sold, and paid out to your wallet in $DROP.</p>
  <div id="sellBody"><div class="empty">Connect your wallet to begin.</div></div>
</main>

<div id="toast"></div>

<script type="module">
import * as web3 from 'https://esm.sh/@solana/web3.js@1.95.3';
let OWNER=null, wallet=null, SELLER=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd=c=>c!=null?('$'+(c/100).toFixed(2)):'';
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3200);}
function detectWallet(){
  if(window.phantom&&window.phantom.solana&&window.phantom.solana.isPhantom) return window.phantom.solana;
  if(window.solana&&window.solana.isPhantom) return window.solana;
  if(window.solflare&&window.solflare.isSolflare) return window.solflare;
  if(window.solana) return window.solana; return null;
}
function setWalletUI(){ const el=$('connectBtn'); if(el) el.textContent = OWNER ? (OWNER.slice(0,4)+'…'+OWNER.slice(-4)) : 'Connect wallet'; }
async function connect(){
  const p=detectWallet();
  if(!p){ toast('No Solana wallet found — install Phantom or Solflare.'); return false; }
  try{ const r=await p.connect(); wallet=p; OWNER=((r&&r.publicKey)?r.publicKey:p.publicKey).toString(); setWalletUI(); return true; }
  catch(e){ toast('Wallet connection cancelled.'); return false; }
}
async function ensureWallet(){ if(OWNER) return true; return await connect(); }
async function signMsg(action){
  const ts=Math.floor(Date.now()/1000);
  const msg=`DROPRATE devmarket ${action} wallet:${OWNER} ts:${ts}`;
  const enc=new TextEncoder().encode(msg);
  const res=await wallet.signMessage(enc,'utf8');
  const sig=(res&&res.signature)?res.signature:res;
  const bytes=sig instanceof Uint8Array?sig:new Uint8Array(sig);
  let s=''; for(const b of bytes) s+=String.fromCharCode(b);
  return { message:msg, signature:btoa(s) };
}
async function api(body){
  let r,j;
  try{ r=await fetch('/api/crate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ns:'devmarket',...body})}); }
  catch(e){ return {error:'network error'}; }
  try{ j=await r.json(); }catch{ j={error:'server error ('+r.status+')'}; }
  return j;
}
async function apiSigned(action, extra={}){
  if(!await ensureWallet()) return {error:'wallet required'};
  let sig; try{ sig=await signMsg(action); }catch(e){ return {error:'signature cancelled'}; }
  return api({action, wallet:OWNER, message:sig.message, signature:sig.signature, ...extra});
}

async function loadSell(){
  const body=$('sellBody');
  if(!OWNER){ body.innerHTML=`<div class="panel"><h3>Sell your keys</h3><p class="hint">Connect your wallet to apply as a developer. Your wallet is your seller identity and where $DROP payouts land.</p><button class="btn" id="sellConnect">Connect wallet</button></div>`;
    $('sellConnect').onclick=async()=>{ if(await connect()) loadSell(); }; return; }
  body.innerHTML=`<div class="empty">Loading your seller status…</div>`;
  const d=await apiSigned('seller-status');
  if(d.error){ body.innerHTML=`<div class="panel"><p class="hint">${esc(d.error)}</p><button class="btn" id="retry">Retry</button></div>`; $('retry').onclick=loadSell; return; }
  SELLER=d.seller;
  if(!SELLER){ return renderApply(); }
  if(SELLER.status==='pending'){ return renderStatus('Application under review','warn','We\'re reviewing your studio. You\'ll be able to list keys once approved.'); }
  if(SELLER.status==='rejected'){ return renderStatus('Application not approved','muted',(SELLER.notes||'You can update your details and re-apply below.'),true); }
  if(SELLER.status==='suspended'){ return renderStatus('Account suspended','muted','Reach out to support to resolve this.'); }
  return renderDashboard(d.products||[]);
}
function renderApply(){
  $('sellBody').innerHTML=`<div class="panel">
    <h3>Apply to sell</h3>
    <p class="hint">Verified developers only — a human reviews each application. You also contribute ~5 keys to the DropRate draws/gacha (great exposure). You keep 98.5% (1.5% fee), paid in $DROP.</p>
    <label class="f">Studio / publisher name</label><input id="ap-studio" placeholder="Your studio">
    <div class="row"><div><label class="f">Contact email</label><input id="ap-contact" placeholder="you@studio.com"></div>
    <div><label class="f">Website</label><input id="ap-web" placeholder="https://"></div></div>
    <label class="f">Steam App IDs (comma-separated)</label><input id="ap-appids" placeholder="e.g. 413150, 892970">
    <button class="btn" id="ap-submit" style="margin-top:18px">Submit application</button>
    <div class="res" id="ap-res"></div>
  </div>`;
  $('ap-submit').onclick=async()=>{
    const r=await apiSigned('seller-apply',{ studio:$('ap-studio').value.trim(), contact:$('ap-contact').value.trim(),
      website:$('ap-web').value.trim(), steam_appids:$('ap-appids').value.trim(), payout_currency:'DROP' });
    if(r.error){ $('ap-res').innerHTML='<span style="color:var(--red)">'+esc(r.error)+'</span>'; return; }
    toast('Application submitted!'); loadSell();
  };
}
function renderStatus(title,pill,msg,reapply){
  $('sellBody').innerHTML=`<div class="panel"><h3>${esc(title)}</h3>
    <div style="margin:8px 0"><span class="pill ${pill}">${esc(SELLER.status)}</span></div>
    <p class="hint">${esc(msg)}</p>
    ${reapply?'<button class="btn" id="reapply">Update &amp; re-apply</button>':''}</div>`;
  if(reapply) $('reapply').onclick=()=>renderApply();
}
function renderDashboard(products){
  const rows=products.length?products.map(p=>`
    <div class="prodrow">
      <div>
        <div style="font-weight:600">${esc(p.title)} <span class="mini">· ${usd(p.price_cents)} · ${esc(p.region||'GLOBAL')}</span></div>
        <div class="mini">${p.available} available · ${p.sold} sold · ${p.active?'<span style="color:var(--green)">live</span>':'<span style="color:var(--muted)">hidden</span>'}</div>
      </div>
      <div style="flex:0 0 auto"><button class="btn ghost" data-up="${p.id}" data-title="${esc(p.title)}">Upload keys</button></div>
    </div>`).join(''):'<div class="mini" style="padding:12px 0">No products yet — create your first below.</div>';
  $('sellBody').innerHTML=`
    <div class="panel">
      <h3>Seller dashboard <span class="pill ok" style="margin-left:8px">approved</span></h3>
      <p class="hint">Payouts land in this wallet as $DROP. Fee is 1.5%. ${SELLER.sold_count?('You\'ve sold '+SELLER.sold_count+' key'+(SELLER.sold_count==1?'':'s')+'.'):''}</p>
      <div id="prodList">${rows}</div>
    </div>
    <div class="panel">
      <h3>New product</h3>
      <div class="row"><div><label class="f">Game title</label><input id="np-title" placeholder="Game name"></div>
      <div><label class="f">Price (USD)</label><input id="np-price" placeholder="19.99" inputmode="decimal"></div></div>
      <div class="row"><div><label class="f">Region</label><input id="np-region" placeholder="GLOBAL" value="GLOBAL"></div>
      <div><label class="f">Steam App ID (optional)</label><input id="np-appid" placeholder="413150"></div></div>
      <label class="f">Cover image URL (optional)</label><input id="np-image" placeholder="https://…/cover.jpg">
      <button class="btn" id="np-submit" style="margin-top:18px">Create product</button>
      <div class="res" id="np-res"></div>
    </div>`;
  $('np-submit').onclick=async()=>{
    const dollars=parseFloat(String($('np-price').value).replace(/[^0-9.]/g,''));
    if(!$('np-title').value.trim()){ $('np-res').innerHTML='<span style="color:var(--red)">Title required.</span>'; return; }
    if(!Number.isFinite(dollars)||dollars<=0){ $('np-res').innerHTML='<span style="color:var(--red)">Enter a valid price.</span>'; return; }
    const r=await apiSigned('product-create',{ title:$('np-title').value.trim(), price_cents:Math.round(dollars*100),
      region:$('np-region').value.trim()||'GLOBAL', appid:$('np-appid').value.trim()||null, image:$('np-image').value.trim()||null });
    if(r.error){ $('np-res').innerHTML='<span style="color:var(--red)">'+esc(r.error)+'</span>'; return; }
    toast('Product created.'); loadSell();
  };
  $('prodList').addEventListener('click',e=>{ const u=e.target.closest('[data-up]'); if(u) openUpload(Number(u.dataset.up), u.dataset.title); });
}
function openUpload(productId,title){
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="ovcard">
    <h3 class="disp" style="font-size:1rem">Upload keys — ${esc(title)}</h3>
    <p class="hint" style="color:var(--muted);font-size:.82rem;margin:8px 0 10px">Paste your Steam keys, one per line (ABCDE-FGHIJ-KLMNO). They're encrypted the instant they land — we store ciphertext only, and duplicates are auto-rejected.</p>
    <textarea id="up-keys" placeholder="ABCDE-FGHIJ-KLMNO&#10;PQRST-UVWXY-Z1234"></textarea>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="up-go">Upload</button>
      <button class="btn ghost" data-close="1" style="flex:0 0 auto">Cancel</button>
    </div>
    <div class="res" id="up-res"></div>
  </div>`;
  ov.addEventListener('click',e=>{ if(e.target.dataset.close||e.target===ov) ov.remove(); });
  document.body.appendChild(ov);
  $('up-go').onclick=async()=>{
    const keys=$('up-keys').value.split(/[\r\n,]+/).map(s=>s.trim()).filter(Boolean);
    if(!keys.length){ $('up-res').innerHTML='<span style="color:var(--red)">Paste at least one key.</span>'; return; }
    $('up-go').disabled=true; $('up-res').textContent='Encrypting & uploading…';
    const r=await apiSigned('ingest',{product_id:productId, keys});
    $('up-go').disabled=false;
    if(r.error){ $('up-res').innerHTML='<span style="color:var(--red)">'+esc(r.error)+'</span>'; return; }
    $('up-res').innerHTML=`<span style="color:var(--green)">Added ${r.added}</span> · ${r.duplicate} duplicate · ${r.invalid} invalid · ${r.available} now available`;
    toast(`Uploaded ${r.added} key${r.added==1?'':'s'}.`); loadSell();
  };
}
(function(){ const mb=$('menuBtn'); if(mb) mb.addEventListener('click',()=>$('nav').classList.toggle('open')); })();
$('connectBtn').addEventListener('click',async()=>{ if(await connect()) loadSell(); });
loadSell();
</script>
</body>
</html>
